# Netlify reads this file, so there is nothing to fill in on the Netlify site.
# The checks run first; if they fail, Netlify does not publish.
[build]
  command = "npm run check && npm run build && npm run build-storybook -- --output-dir dist/storybook --quiet"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
