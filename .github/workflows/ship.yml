name: Check and ship

# Every push and pull request is checked. Pushes to main that pass are published to
# GitHub Pages: the game at /bodai-word-ladder/ and Storybook at /bodai-word-ladder/storybook/.
# GitHub Actions and Pages are free for public repos, with no deploy limits.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /bodai-word-ladder/
      - run: npm run build-storybook -- --output-dir dist/storybook --quiet
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
